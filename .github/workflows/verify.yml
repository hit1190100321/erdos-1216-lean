name: 核验完整形式化

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 固定 v7.0.1
      - name: 安装固定的 Lean 工具链
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: 获取所需 mathlib 缓存
        run: lake exe cache get Mathlib.Tactic Mathlib.Logic.Equiv.Fintype Mathlib.Data.Fintype.Sum Mathlib.Data.Fin.VecNotation Mathlib.Data.Finset.Lattice.Fold
      - name: 构建、公理审计及声明重放
        run: python3 scripts/verify.py
      - name: 保存核验报告
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 固定 v7.0.1
        with:
          name: 核验报告
          path: .research-cache/verification.json
          include-hidden-files: true
          if-no-files-found: error
